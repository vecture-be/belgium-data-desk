<rect x="25" y="1068" width="650" height="235" rx="16" fill="#eaf7ff" stroke="#639ab7" stroke-width="2"/>
<text x="48" y="1106" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#21374c">Two complementary data paths</text>
<rect x="46" y="1130" width="608" height="67" rx="10" fill="#fff" stroke="#629ab8"/>
<text x="66" y="1156" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#264969">Indexed discovery</text>
<text x="66" y="1182" font-family="Inter,Arial,sans-serif" font-size="18" fill="#566f86">Harvest → curate → verify → publish shards</text>
<rect x="46" y="1213" width="608" height="67" rx="10" fill="#fff" stroke="#629ab8"/>
<text x="66" y="1239" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#264969">Live domain answers</text>
<text x="66" y="1265" font-family="Inter,Arial,sans-serif" font-size="18" fill="#566f86">Validate input → query official API → cite</text>
<path d="M350 1304 V1324" stroke="#677f95" stroke-width="3" marker-end="url(#arr)"/>
<!-- Sources -->
<rect x="25" y="1331" width="650" height="124" rx="16" fill="#e7f9ed" stroke="#56a376" stroke-width="2"/>
<text x="48" y="1368" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#21374c">Official data publishers</text>
<text x="48" y="1407" font-family="Inter,Arial,sans-serif" font-size="20" fill="#334f6a">Federal · regional · local · EU</text>
<text x="48" y="1438" font-family="Inter,Arial,sans-serif" font-size="19" fill="#566f86">DCAT · CKAN · ODS · WFS / OGC APIs</text>
<!-- Delivery -->
<rect x="25" y="1481" width="650" height="162" rx="16" fill="#f4f6fa" stroke="#8da0b3" stroke-width="2"/>
<text x="48" y="1519" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#21374c">Quality &amp; delivery</text>
<text x="48" y="1560" font-family="Inter,Arial,sans-serif" font-size="20" fill="#334f6a">Tests · fixtures · relevance · health checks</text>
<text x="48" y="1594" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334f6a">Reviewed contributions · controlled releases</text>
<text x="48" y="1624" font-family="Inter,Arial,sans-serif" font-size="18" fill="#647a91">Planned: stronger staging / rollback gates</text>
<!-- Ownership -->
<rect x="25" y="1664" width="650" height="110" rx="16" fill="#f1eefc" stroke="#8979b5" stroke-width="2"/>
<text x="48" y="1700" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#21374c">Open source, client-neutral</text>
<text x="48" y="1738" font-family="Inter,Arial,sans-serif" font-size="19" fill="#334f6a">Public core · thin Claude integration</text>
<text x="25" y="1801" font-family="Inter,Arial,sans-serif" font-size="16" fill="#596c81">Logical capability map · not a physical deployment inventory</text>
</svg>