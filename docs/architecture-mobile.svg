<text x="48" y="304" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#21374c">Public service interfaces</text>
<text x="48" y="344" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334f6a">data.vecture.be · website and API</text>
<text x="48" y="378" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334f6a">Read-only /mcp · stable tool contracts</text>
<path d="M350 414 V435" stroke="#677f95" stroke-width="3" marker-end="url(#arr)"/>
