<text x="48" y="147" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#21374c">Access channels</text>
<text x="48" y="185" font-family="Inter,Arial,sans-serif" font-size="21" fill="#3b536b">Web app · Claude · other MCP clients</text>
<text x="48" y="215" font-family="Inter,Arial,sans-serif" font-size="20" fill="#596f84">Developers · citizens · public-data users</text>
<path d="M350 240 V261" stroke="#677f95" stroke-width="3" marker-end="url(#arr)"/>
