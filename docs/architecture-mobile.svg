<rect x="25" y="614" width="650" height="237" rx="16" fill="#e9f8ee" stroke="#59a170" stroke-width="2"/>
<text x="48" y="651" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#21374c">Expert domain capabilities</text>
<g font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#284936">
<rect x="46" y="679" width="295" height="62" rx="10" fill="#fff" stroke="#69a77a" stroke-width="2"/>
<rect x="358" y="679" width="296" height="62" rx="10" fill="#fff" stroke="#69a77a" stroke-width="2"/>
<text x="193" y="718">DOV · geology</text><text x="506" y="718">Statbel · figures</text>
<rect x="46" y="756" width="295" height="62" rx="10" fill="#fff" stroke="#69a77a" stroke-width="2"/>
<rect x="358" y="756" width="296" height="62" rx="10" fill="#fff" stroke="#69a77a" stroke-width="2"/>
<text x="193" y="795">IRCEL · air</text><text x="506" y="795">VMM · flood</text>
</g>
<text x="48" y="841" font-family="Inter,Arial,sans-serif" font-size="18" fill="#596f84">Planned: Waterinfo · GIPOD · additional domains</text>
