<text x="48" y="960" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334f6a">Geo / NIS · units · time semantics</text>
<text x="48" y="994" font-family="Inter,Arial,sans-serif" font-size="20" fill="#334f6a">Provenance · licensing · freshness · limits</text>
<path d="M350 1040 V1061" stroke="#677f95" stroke-width="3" marker-end="url(#arr)"/>
