<text x="48" y="518" font-family="Inter,Arial,sans-serif" font-size="21" fill="#334f6a">Search · inspect · sample · explain</text>
<text x="48" y="553" font-family="Inter,Arial,sans-serif" font-size="20" fill="#4c657b">Results include source, date and caveats</text>
<path d="M350 588 V608" stroke="#677f95" stroke-width="3" marker-end="url(#arr)"/>
