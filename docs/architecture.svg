<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1015" viewBox="0 0 1600 1015" role="img" aria-labelledby="title desc">
<title id="title">Belgium Data Desk — Scalable architecture</title>
<desc id="desc">Clients connect to one Cloudflare Worker and read-only MCP gateway. Modular domain tools use shared safeguards and official Belgian public-data sources. GitHub CI/CD and a thin Claude plugin support the open-source product. Dashed boxes are planned.</desc>
