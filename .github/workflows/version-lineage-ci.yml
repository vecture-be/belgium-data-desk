name: Version and lineage CI
on:
  pull_request:
    paths:
      - "scripts/version-intelligence.mjs"
      - "scripts/test-version-intelligence.mjs"
      - "scripts/validate-version-output.mjs"
      - "scripts/build-cards.mjs"
      - "scripts/change-log.mjs"
      - "package.json"
      - ".github/workflows/version-lineage-ci.yml"
  push:
    branches: ["feat/version-lineage-impact-20261120"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Unit and card integration regression
        run: node scripts/test-version-intelligence.mjs
